<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manutenção OS — Grupo Barreto's</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root{
  --bg:#090A0D;--surface:#0F1117;--card:#151820;--border:#1E2130;
  --gold:#F5B800;--gold-dim:rgba(245,184,0,.12);--gold-b:rgba(245,184,0,.28);
  --txt:#E8EAF0;--txt-dim:#6B7280;--txt-mid:#9CA3AF;
  --green:#22C55E;--red:#EF4444;--blue:#3B82F6;--orange:#F97316;--r:8px;
}
body.tema-claro{
  --bg:#F0F2F5;--surface:#FFFFFF;--card:#FFFFFF;--border:#E2E6ED;
  --gold:#D97706;--gold-dim:rgba(217,119,6,.10);--gold-b:rgba(217,119,6,.28);
  --txt:#111827;--txt-dim:#6B7280;--txt-mid:#4B5563;
  --green:#059669;--red:#DC2626;--blue:#2563EB;--orange:#EA580C;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{min-height:100vh;background:var(--bg);color:var(--txt);font-family:'Montserrat',sans-serif;transition:background .15s,color .15s;}
body{padding-bottom:24px;}

/* ── TOPBAR ── */
.topbar{height:52px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 14px;gap:8px;flex-shrink:0;position:sticky;top:0;z-index:50;}
.tb-logo-img{height:26px;width:auto;flex-shrink:0;}
.logo-escuro{display:block}
.logo-claro{display:none}
body.tema-claro .logo-escuro{display:none}
body.tema-claro .logo-claro{display:block}
.tb-sep{color:var(--border);font-size:18px;}
.tb-title{font-size:12px;color:var(--txt-mid);font-weight:600;}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:7px;}
.theme-toggle{width:30px;height:30px;border-radius:50%;background:var(--card);border:1px solid var(--border);color:var(--txt-mid);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;flex-shrink:0;}
.theme-toggle:hover{color:var(--gold);border-color:var(--gold);}
.bsm{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--txt-dim);
  padding:5px 10px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:5px;
  transition:all .15s;font-family:'Montserrat',sans-serif;white-space:nowrap;}
.bsm:hover{border-color:var(--gold);color:var(--gold);}

/* ── LAYOUT ── */
.wrap{max-width:720px;margin:0 auto;padding:16px 14px 0;}
.hero{padding:18px 4px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
.hero h1{font-family:'Montserrat',sans-serif;font-size:19px;font-weight:800;color:var(--txt);margin-bottom:4px;}
.hero p{font-size:12px;color:var(--txt-dim);}
.bprim{background:var(--gold);color:#111;border:none;border-radius:8px;padding:10px 16px;font-size:12.5px;
  font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:opacity .15s;white-space:nowrap;flex-shrink:0;}
.bprim:hover{opacity:.88;}

/* ── KPIs ── */
.kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px;}
.kpi-tile{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 10px;text-align:center;}
.kpi-val{font-family:'Montserrat',sans-serif;font-size:22px;font-weight:800;line-height:1;}
.kpi-lbl{font-size:9.5px;color:var(--txt-dim);text-transform:uppercase;letter-spacing:.04em;margin-top:5px;font-weight:600;}

/* ── TABS ── */
.search-box{position:relative;margin-bottom:12px;}
.search-box i.ti-search{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--txt-dim);font-size:14px;pointer-events:none;}
.search-box input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--txt);
  font-family:'Montserrat',sans-serif;font-size:13px;padding:11px 36px;outline:none;}
.search-box input:focus{border-color:var(--gold);}
.search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--txt-dim);
  cursor:pointer;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.search-clear:hover{color:var(--gold);}

.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;}
.tab{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:20px;color:var(--txt-dim);
  padding:7px 14px;font-size:11.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;
  font-family:'Montserrat',sans-serif;white-space:nowrap;transition:all .15s;}
.tab.active{background:var(--gold-dim);border-color:var(--gold-b);color:var(--gold);}
.tab-ct{background:var(--card);border-radius:10px;padding:1px 6px;font-size:10px;}
.tab.active .tab-ct{background:var(--gold);color:#111;}

/* ── OS CARD ── */
.os-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.os-hd{padding:12px 14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
.os-placa{font-family:'Montserrat',sans-serif;font-weight:800;font-size:13px;color:var(--gold);white-space:nowrap;}
.os-main{flex:1;min-width:0;}
.os-item{font-size:12.5px;font-weight:600;color:var(--txt);margin-bottom:2px;}
.os-meta{font-size:10.5px;color:var(--txt-dim);}
.os-badge{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap;}
.os-badge.aberta{background:rgba(239,68,68,.14);color:var(--red);}
.os-badge.em_andamento{background:rgba(245,184,0,.14);color:var(--gold);}
.os-badge.concluida{background:rgba(34,197,94,.14);color:var(--green);}
.os-prio{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;padding:3px 9px;border-radius:20px;flex-shrink:0;white-space:nowrap;}
.os-prio.baixa{background:rgba(34,197,94,.14);color:var(--green);}
.os-prio.media{background:rgba(245,184,0,.14);color:var(--gold);}
.os-prio.alta{background:rgba(239,68,68,.14);color:var(--red);}
.os-chev{color:var(--txt-dim);font-size:14px;transition:transform .2s;flex-shrink:0;margin-top:2px;}
.os-card.open .os-chev{transform:rotate(180deg);}
.os-body{display:none;padding:0 14px 14px;border-top:1px solid var(--border);}
.os-card.open .os-body{display:block;}
.os-problema{font-size:12px;color:var(--txt-mid);line-height:1.5;padding:12px 0 10px;}
.os-fotos-info{font-size:11px;color:var(--txt-dim);display:flex;align-items:center;gap:5px;margin-bottom:12px;}
.os-field{margin-bottom:10px;}
.os-field label{display:block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--txt-dim);margin-bottom:4px;}
.os-field input,.os-field select,.os-field textarea{width:100%;background:var(--card);border:1px solid var(--border);border-radius:6px;
  color:var(--txt);font-family:'Montserrat',sans-serif;font-size:12.5px;padding:8px 10px;outline:none;}
.os-field input:focus,.os-field select:focus,.os-field textarea:focus{border-color:var(--gold);}
.os-actions{display:flex;gap:8px;margin-top:10px;}
.os-actions button{flex:1;border:none;border-radius:7px;padding:9px;font-size:11.5px;font-weight:700;
  font-family:'Montserrat',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;}
.os-btn-andamento{background:var(--gold-dim);color:var(--gold);border:1px solid var(--gold-b) !important;}
.os-btn-concluir{background:var(--green);color:#fff;}
.os-btn-reabrir{background:var(--card);color:var(--txt-mid);border:1px solid var(--border) !important;}
.os-notas{margin-top:12px;}
.os-nota{background:var(--card);border-radius:7px;padding:8px 10px;margin-bottom:6px;font-size:11.5px;color:var(--txt);}
.os-nota-meta{font-size:9.5px;color:var(--txt-dim);margin-top:3px;}
.os-add-nota{display:flex;gap:6px;margin-top:8px;}
.os-add-nota input{flex:1;}
.os-add-nota button{background:var(--card);border:1px solid var(--border);border-radius:6px;color:var(--txt-mid);
  padding:0 12px;cursor:pointer;flex-shrink:0;}
.os-add-nota button:hover{color:var(--gold);border-color:var(--gold);}

.empty-state{text-align:center;padding:50px 20px;color:var(--txt-dim);}
.empty-state i{font-size:34px;display:block;margin-bottom:10px;opacity:.4;}
.empty-state p{font-size:12.5px;}

/* ── MODAL NOVA OS ── */
.bghist{background:var(--card);border:1px solid var(--border);color:var(--txt-mid);border-radius:8px;padding:10px 16px;
  font-size:12.5px;font-weight:700;font-family:'Montserrat',sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;}
.bghist:hover{border-color:var(--gold);color:var(--gold);}

/* ── PAINEL LATERAL: HISTÓRICO DE CHECKLISTS ── */
.hist-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:210;}
.hist-ov.show{display:block;}
.hist-panel{position:fixed;top:0;right:0;bottom:0;width:88%;max-width:400px;background:var(--surface);
  border-left:1px solid var(--border);z-index:211;transform:translateX(100%);transition:transform .25s ease;
  display:flex;flex-direction:column;}
.hist-ov.show .hist-panel{transform:translateX(0);}
.hist-hd{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.hist-hd h2{font-family:'Montserrat',sans-serif;font-size:15px;font-weight:800;}
.hist-close{background:none;border:none;color:var(--txt-dim);font-size:18px;cursor:pointer;}
.hist-list{flex:1;overflow-y:auto;padding:12px;}
.hist-card{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:9px;overflow:hidden;}
.hist-card-hd{padding:11px 13px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.hist-placa{font-family:'Montserrat',sans-serif;font-weight:800;font-size:12.5px;color:var(--gold);white-space:nowrap;}
.hist-main{flex:1;min-width:0;}
.hist-motorista{font-size:11.5px;font-weight:600;color:var(--txt);}
.hist-data{font-size:10px;color:var(--txt-dim);}
.hist-badge{font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;}
.hist-badge.ok{background:rgba(34,197,94,.14);color:var(--green);}
.hist-badge.bad{background:rgba(239,68,68,.14);color:var(--red);}
.hist-chev{color:var(--txt-dim);font-size:13px;flex-shrink:0;transition:transform .2s;}
.hist-card.open .hist-chev{transform:rotate(180deg);}
.hist-card-body{display:none;padding:0 13px 12px;border-top:1px solid var(--border);}
.hist-card.open .hist-card-body{display:block;}
.hist-item-row{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:11px;}
.hist-item-row:last-child{border-bottom:none;}
.hist-item-ic{width:16px;height:16px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px;margin-top:1px;}
.hist-item-ic.ok{background:rgba(34,197,94,.18);color:var(--green);}
.hist-item-ic.bad{background:rgba(239,68,68,.18);color:var(--red);}
.hist-item-ic.na{background:rgba(107,114,128,.25);color:var(--txt-mid);}
.hist-item-txt{flex:1;color:var(--txt);}
.hist-item-obs{color:var(--txt-dim);font-size:10.5px;margin-top:2px;}
.hist-obsgeral{font-size:11px;color:var(--txt-mid);padding:10px 0;border-bottom:1px solid var(--border);margin-bottom:4px;}
.hist-seed{background:var(--gold-dim);border:1px dashed var(--gold-b);color:var(--gold);border-radius:8px;padding:10px;
  font-size:11px;font-weight:600;font-family:'Montserrat',sans-serif;cursor:pointer;width:100%;margin-top:12px;}

.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:flex-end;justify-content:center;}
.modal-ov.show{display:flex;}
.modal-box{background:var(--surface);border-top:1px solid var(--border);border-radius:16px 16px 0 0;padding:18px 16px 24px;
  width:100%;max-width:720px;max-height:88vh;overflow-y:auto;}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-hd h2{font-family:'Montserrat',sans-serif;font-size:16px;font-weight:800;}
.modal-close{background:none;border:none;color:var(--txt-dim);font-size:18px;cursor:pointer;}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--card);
  border:1px solid var(--gold-b);border-radius:8px;padding:10px 18px;font-size:12px;color:var(--txt);
  display:flex;align-items:center;gap:8px;opacity:0;pointer-events:none;transition:all .25s;z-index:300;box-shadow:0 6px 24px rgba(0,0,0,.5);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast i{color:var(--green);font-size:15px;}
</style>
</head>
<body>

<div class="wrap">

  <div class="hero">
    <div>
      <h1>Manutenção OS</h1>
      <p>Ordens de serviço abertas automaticamente pelos checklists, e as que você criar aqui.</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:7px;flex-shrink:0">
      <button class="bprim" onclick="abrirModalNovaOs()"><i class="ti ti-plus"></i> Nova OS</button>
      <button class="bghist" onclick="abrirHistorico()"><i class="ti ti-history"></i> Histórico</button>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi-tile"><div class="kpi-val" id="kpi-aberta" style="color:var(--red)">0</div><div class="kpi-lbl">Abertas</div></div>
    <div class="kpi-tile"><div class="kpi-val" id="kpi-andamento" style="color:var(--gold)">0</div><div class="kpi-lbl">Em Andamento</div></div>
    <div class="kpi-tile"><div class="kpi-val" id="kpi-concluida" style="color:var(--green)">0</div><div class="kpi-lbl">Concluídas</div></div>
  </div>

  <div class="search-box">
    <i class="ti ti-search"></i>
    <input type="text" id="busca-os" placeholder="Buscar por placa ou mecânico..." oninput="renderTudo()">
    <button class="search-clear" id="busca-clear" onclick="limparBusca()" style="display:none"><i class="ti ti-x"></i></button>
  </div>

  <div class="tabs">
    <div class="tab active" data-filtro="aberta" onclick="filtrar(this)">Abertas <span class="tab-ct" id="ct-aberta">0</span></div>
    <div class="tab" data-filtro="em_andamento" onclick="filtrar(this)">Em Andamento <span class="tab-ct" id="ct-andamento">0</span></div>
    <div class="tab" data-filtro="concluida" onclick="filtrar(this)">Concluídas <span class="tab-ct" id="ct-concluida">0</span></div>
    <div class="tab" data-filtro="todas" onclick="filtrar(this)">Todas <span class="tab-ct" id="ct-todas">0</span></div>
  </div>

  <div id="lista-os"></div>

</div>

<!-- MODAL NOVA OS -->
<div class="modal-ov" id="modal-nova-os">
  <div class="modal-box">
    <div class="modal-hd">
      <h2>Nova Ordem de Serviço</h2>
      <button class="modal-close" onclick="fecharModalNovaOs()"><i class="ti ti-x"></i></button>
    </div>
    <div class="os-field">
      <label>Placa *</label>
      <input type="text" id="nos-placa" placeholder="ABC1D23" style="text-transform:uppercase">
    </div>
    <div class="os-field">
      <label>Motorista</label>
      <input type="text" id="nos-motorista" placeholder="Nome completo (opcional)">
    </div>
    <div class="os-field">
      <label>Problema / Serviço *</label>
      <textarea id="nos-problema" rows="3" placeholder="Descreva o que precisa ser feito..."></textarea>
    </div>
    <div class="os-field">
      <label>Prioridade</label>
      <select id="nos-prioridade">
        <option value="baixa">Baixa</option>
        <option value="media" selected>Média</option>
        <option value="alta">Alta</option>
      </select>
    </div>
    <button class="bprim" style="width:100%" onclick="salvarNovaOs()"><i class="ti ti-check"></i> Criar OS</button>
  </div>
</div>

<!-- PAINEL LATERAL: HISTÓRICO DE CHECKLISTS -->
<div class="hist-ov" id="hist-ov" onclick="if(event.target===this) fecharHistorico()">
  <div class="hist-panel">
    <div class="hist-hd">
      <h2>Histórico de Checklists</h2>
      <button class="hist-close" onclick="fecharHistorico()"><i class="ti ti-x"></i></button>
    </div>
    <div class="hist-list" id="hist-list"></div>
  </div>
</div>

<div class="toast" id="toast"><i class="ti ti-check"></i><span id="toast-msg"></span></div>

<script>
// ── Config + autenticação (mesmo padrão do checklist_caminhao.html) ──
const API_BASE = 'https://barretos-backend.onrender.com/api';
const SUPABASE_URL = 'https://qjwobkpgqmaqisphwonl.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_c4MrJXB6nTHY0a5ShAFRaQ_Jc4qDdPr';

if (!localStorage.getItem('mf_auth_token')) {
  location.href = 'index.html';
}

function getAuthToken()    { return localStorage.getItem('mf_auth_token'); }
function getRefreshToken() { return localStorage.getItem('mf_auth_refresh'); }

async function tentarRenovarToken(){
  var refresh = getRefreshToken();
  if(!refresh) return false;
  try{
    var r = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{'Content-Type':'application/json', apikey: SUPABASE_ANON_KEY},
      body: JSON.stringify({ refresh_token: refresh }),
    });
    if(!r.ok) return false;
    var j = await r.json();
    localStorage.setItem('mf_auth_token', j.access_token);
    localStorage.setItem('mf_auth_refresh', j.refresh_token);
    return true;
  }catch(e){ return false; }
}

async function apiFetch(url, options){
  options = options || {};
  var headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + getAuthToken() });
  var res = await fetch(url, Object.assign({}, options, { headers: headers }));
  if(res.status === 401){
    if(await tentarRenovarToken()){
      headers.Authorization = 'Bearer ' + getAuthToken();
      res = await fetch(url, Object.assign({}, options, { headers: headers }));
    }
  }
  return res;
}

// ── Dados vêm do Supabase agora — cache em memória alimentado por
// recarregarOs()/recarregarHistorico(); o resto da tela (renderTudo,
// renderHistorico etc.) continua lendo por carregarOs()/
// carregarHistoricoChecklists() como antes, só que agora é o cache. ──
function mapOsDoApi_(o){
  return {
    id: o.id, checklistChave: o.checklist_id, placa: o.placa, motorista: o.motorista,
    item: o.item, problema: o.problema, qtdFotos: o.qtd_fotos,
    dataAbertura: o.data_abertura, status: o.status, mecanico: o.mecanico,
    notas: o.notas || [], prioridade: o.prioridade || 'media'
  };
}
function mapChecklistDoApi_(c){
  return {
    id: c.id, motorista: c.motorista, placa: c.placa,
    dataHora: fmtData(c.data_hora), dataHoraIso: c.data_hora,
    observacaoGeral: c.observacao_geral, itens: c.itens || [],
    totalReprovados: c.total_reprovados
  };
}

let osCache = [];
let checklistsCache = [];

async function recarregarOs(){
  try{
    const res = await apiFetch(API_BASE + '/frota-os');
    if(res.ok) osCache = (await res.json()).map(mapOsDoApi_);
  }catch(e){}
  renderTudo();
}
async function recarregarHistorico(){
  try{
    const res = await apiFetch(API_BASE + '/frota-os/checklists');
    if(res.ok) checklistsCache = (await res.json()).map(mapChecklistDoApi_);
  }catch(e){}
}

function carregarOs(){ return osCache; }
function carregarHistoricoChecklists(){ return checklistsCache; }

let filtroAtual = 'aberta';

// ── Histórico de checklists (painel lateral) ──────────────────────
async function abrirHistorico(){
  document.getElementById('hist-ov').classList.add('show');
  await recarregarHistorico();
  renderHistorico();
}
function fecharHistorico(){
  document.getElementById('hist-ov').classList.remove('show');
}
function toggleHist(hd){
  hd.closest('.hist-card').classList.toggle('open');
}

function iconeStatus(s){
  return s === 'ok' ? 'ti-check' : s === 'bad' ? 'ti-x' : 'ti-minus';
}

function renderHistorico(){
  const hist = carregarHistoricoChecklists().slice().sort((a,b) => new Date(b.dataHoraIso) - new Date(a.dataHoraIso));
  const lista = document.getElementById('hist-list');
  if(!hist.length){
    lista.innerHTML = '<div class="empty-state" style="padding:30px 10px"><i class="ti ti-history"></i><p>Nenhum checklist enviado ainda.</p></div>';
    return;
  }
  lista.innerHTML = hist.map(function(c, idx){
    const reprovados = c.totalReprovados || 0;
    const itensHtml = (c.itens||[]).filter(it => it.status).map(function(it){
      return '<div class="hist-item-row">' +
        '<div class="hist-item-ic ' + it.status + '"><i class="ti ' + iconeStatus(it.status) + '"></i></div>' +
        '<div class="hist-item-txt">' + e(it.item) + (it.obs ? '<div class="hist-item-obs">' + e(it.obs) + '</div>' : '') + '</div>' +
      '</div>';
    }).join('');
    return '<div class="hist-card" data-idx="' + idx + '">' +
      '<div class="hist-card-hd" onclick="toggleHist(this)">' +
        '<div class="hist-placa">' + e(c.placa) + '</div>' +
        '<div class="hist-main"><div class="hist-motorista">' + e(c.motorista) + '</div><div class="hist-data">' + e(c.dataHora) + '</div></div>' +
        '<div class="hist-badge ' + (reprovados > 0 ? 'bad' : 'ok') + '">' + (reprovados > 0 ? reprovados + ' reprovado(s)' : 'Tudo OK') + '</div>' +
        '<i class="ti ti-chevron-down hist-chev"></i>' +
      '</div>' +
      '<div class="hist-card-body">' +
        (c.observacaoGeral ? '<div class="hist-obsgeral">' + e(c.observacaoGeral) + '</div>' : '') +
        itensHtml +
      '</div>' +
    '</div>';
  }).join('');
}



function e(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function fmtData(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad(d.getHours())+':'+pad(d.getMinutes());
}

function labelStatus(s){
  return s === 'aberta' ? 'Aberta' : s === 'em_andamento' ? 'Em Andamento' : 'Concluída';
}
function labelPrioridade(p){
  return p === 'baixa' ? 'Baixa' : p === 'alta' ? 'Alta' : 'Média';
}

function renderTudo(){
  const todas = carregarOs();
  document.getElementById('kpi-aberta').textContent = todas.filter(o=>o.status==='aberta').length;
  document.getElementById('kpi-andamento').textContent = todas.filter(o=>o.status==='em_andamento').length;
  document.getElementById('kpi-concluida').textContent = todas.filter(o=>o.status==='concluida').length;
  document.getElementById('ct-aberta').textContent = todas.filter(o=>o.status==='aberta').length;
  document.getElementById('ct-andamento').textContent = todas.filter(o=>o.status==='em_andamento').length;
  document.getElementById('ct-concluida').textContent = todas.filter(o=>o.status==='concluida').length;
  document.getElementById('ct-todas').textContent = todas.length;

  const termoBusca = (document.getElementById('busca-os')?.value || '').trim().toLowerCase();
  const buscaClear = document.getElementById('busca-clear');
  if(buscaClear) buscaClear.style.display = termoBusca ? 'flex' : 'none';

  let filtradas = filtroAtual === 'todas' ? todas : todas.filter(o=>o.status===filtroAtual);
  if(termoBusca){
    filtradas = filtradas.filter(o =>
      (o.placa||'').toLowerCase().includes(termoBusca) ||
      (o.mecanico||'').toLowerCase().includes(termoBusca)
    );
  }
  filtradas = filtradas.slice().sort((a,b)=> new Date(b.dataAbertura) - new Date(a.dataAbertura));

  const lista = document.getElementById('lista-os');
  if(!filtradas.length){
    const msg = termoBusca ? 'Nenhuma OS encontrada para "'+e(termoBusca)+'".' : 'Nenhuma OS '+(filtroAtual==='todas'?'registrada':'nessa situação')+' ainda.';
    lista.innerHTML = '<div class="empty-state"><i class="ti ti-clipboard-off"></i><p>'+msg+'</p></div>';
    return;
  }

  lista.innerHTML = filtradas.map(function(os){
    const notasHtml = (os.notas||[]).map(function(n){
      return '<div class="os-nota">'+e(n.texto)+'<div class="os-nota-meta">'+fmtData(n.data)+'</div></div>';
    }).join('');

    let acoesHtml = '';
    if(os.status === 'aberta'){
      acoesHtml = '<button class="os-btn-andamento" onclick="mudarStatus(event,\''+os.id+'\',\'em_andamento\')"><i class="ti ti-tool"></i> Iniciar</button>'+
        '<button class="os-btn-concluir" onclick="mudarStatus(event,\''+os.id+'\',\'concluida\')"><i class="ti ti-check"></i> Concluir</button>';
    } else if(os.status === 'em_andamento'){
      acoesHtml = '<button class="os-btn-concluir" onclick="mudarStatus(event,\''+os.id+'\',\'concluida\')"><i class="ti ti-check"></i> Concluir</button>'+
        '<button class="os-btn-reabrir" onclick="mudarStatus(event,\''+os.id+'\',\'aberta\')"><i class="ti ti-arrow-back-up"></i> Voltar</button>';
    } else {
      acoesHtml = '<button class="os-btn-reabrir" onclick="mudarStatus(event,\''+os.id+'\',\'aberta\')"><i class="ti ti-refresh"></i> Reabrir</button>';
    }

    return '<div class="os-card" data-id="'+os.id+'">'+
      '<div class="os-hd" onclick="toggleOs(this)">'+
        '<div class="os-placa">'+e(os.placa)+'</div>'+
        '<div class="os-main">'+
          '<div class="os-item">'+e(os.item)+'</div>'+
          '<div class="os-meta">'+(os.motorista?e(os.motorista)+' · ':'')+fmtData(os.dataAbertura)+(os.checklistChave?' · via checklist':' · manual')+'</div>'+
        '</div>'+
        '<div class="os-prio '+(os.prioridade||'media')+'">'+labelPrioridade(os.prioridade)+'</div>'+
        '<div class="os-badge '+os.status+'">'+labelStatus(os.status)+'</div>'+
        '<i class="ti ti-chevron-down os-chev"></i>'+
      '</div>'+
      '<div class="os-body">'+
        (os.problema ? '<div class="os-problema">'+e(os.problema)+'</div>' : '') +
        (os.qtdFotos ? '<div class="os-fotos-info"><i class="ti ti-camera"></i> '+os.qtdFotos+' foto(s) anexada(s) no checklist</div>' : '') +
        '<div class="os-field">'+
          '<label>Prioridade</label>'+
          '<select onclick="event.stopPropagation()" onchange="atualizarPrioridade(\''+os.id+'\', this.value)">'+
            '<option value="baixa"'+(os.prioridade==='baixa'?' selected':'')+'>Baixa</option>'+
            '<option value="media"'+(!os.prioridade||os.prioridade==='media'?' selected':'')+'>Média</option>'+
            '<option value="alta"'+(os.prioridade==='alta'?' selected':'')+'>Alta</option>'+
          '</select>'+
        '</div>'+
        '<div class="os-field">'+
          '<label>Mecânico responsável</label>'+
          '<input type="text" value="'+e(os.mecanico||'')+'" placeholder="Nome do mecânico" onchange="atualizarMecanico(\''+os.id+'\', this.value)">'+
        '</div>'+
        '<div class="os-actions">'+acoesHtml+'</div>'+
        '<div class="os-notas">'+notasHtml+
          '<div class="os-add-nota">'+
            '<input type="text" placeholder="Adicionar observação..." onkeydown="if(event.key===\'Enter\'){adicionarNota(\''+os.id+'\', this); event.preventDefault();}">'+
            '<button onclick="adicionarNota(\''+os.id+'\', this.previousElementSibling)"><i class="ti ti-send"></i></button>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
}

function toggleOs(hd){
  hd.closest('.os-card').classList.toggle('open');
}

function limparBusca(){
  document.getElementById('busca-os').value = '';
  renderTudo();
}

function filtrar(tabEl){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  tabEl.classList.add('active');
  filtroAtual = tabEl.getAttribute('data-filtro');
  renderTudo();
}

async function mudarStatus(ev, id, novoStatus){
  ev.stopPropagation();
  try{
    const res = await apiFetch(API_BASE + '/frota-os/' + id + '/status', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status: novoStatus })
    });
    if(!res.ok) throw new Error();
  }catch(e){ showToast('Erro ao atualizar status.', true); return; }
  await recarregarOs();
  showToast(novoStatus === 'concluida' ? 'OS concluída!' : 'Status atualizado.');
}

async function atualizarMecanico(id, valor){
  try{
    await apiFetch(API_BASE + '/frota-os/' + id + '/mecanico', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mecanico: valor.trim() })
    });
  }catch(e){ showToast('Erro ao salvar mecânico.', true); }
}

async function adicionarNota(id, inputEl){
  const texto = inputEl.value.trim();
  if(!texto) return;
  try{
    const res = await apiFetch(API_BASE + '/frota-os/' + id + '/notas', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto: texto })
    });
    if(!res.ok) throw new Error();
  }catch(e){ showToast('Erro ao adicionar observação.', true); return; }
  inputEl.value = '';
  await recarregarOs();
  // Reabre o card que estava aberto, já que renderTudo() reconstrói tudo
  const card = document.querySelector('.os-card[data-id="'+id+'"]');
  if(card) card.classList.add('open');
}

// ── Nova OS manual ──
function abrirModalNovaOs(){
  document.getElementById('nos-placa').value = '';
  document.getElementById('nos-motorista').value = '';
  document.getElementById('nos-problema').value = '';
  document.getElementById('nos-prioridade').value = 'media';
  document.getElementById('modal-nova-os').classList.add('show');
}
function fecharModalNovaOs(){
  document.getElementById('modal-nova-os').classList.remove('show');
}
async function salvarNovaOs(){
  const placa = document.getElementById('nos-placa').value.trim().toUpperCase();
  const motorista = document.getElementById('nos-motorista').value.trim();
  const problema = document.getElementById('nos-problema').value.trim();
  const prioridade = document.getElementById('nos-prioridade').value;
  if(!placa || !problema){ showToast('Preencha placa e o problema.', true); return; }
  try{
    const res = await apiFetch(API_BASE + '/frota-os', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ placa: placa, motorista: motorista, problema: problema, prioridade: prioridade })
    });
    if(!res.ok) throw new Error();
  }catch(e){ showToast('Erro ao criar OS.', true); return; }
  fecharModalNovaOs();
  await recarregarOs();
  showToast('OS criada com sucesso!');
}

async function atualizarPrioridade(id, prioridade){
  try{
    const res = await apiFetch(API_BASE + '/frota-os/' + id + '/prioridade', {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prioridade: prioridade })
    });
    if(!res.ok) throw new Error();
    const os = osCache.find(o => o.id === id); if(os) os.prioridade = prioridade;
  }catch(e){ showToast('Erro ao alterar prioridade.', true); }
}

function showToast(msg, isErr){
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.querySelector('i').className = isErr ? 'ti ti-x' : 'ti ti-check';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

// ── Tema claro/escuro ──
function aplicarTema(t){
  document.body.classList.toggle('tema-claro', t === 'claro');
  var icon = document.getElementById('theme-icon');
  if(icon) icon.className = 'ti ' + (t === 'claro' ? 'ti-sun' : 'ti-moon');
}
function alternarTema(){
  var atual = localStorage.getItem('mf_tema') === 'claro' ? 'escuro' : 'claro';
  localStorage.setItem('mf_tema', atual);
  aplicarTema(atual);
}

aplicarTema(localStorage.getItem('mf_tema') || 'escuro');
recarregarOs();
</script>
